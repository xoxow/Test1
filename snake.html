<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스네이크 게임</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1a1a2e; color:#eee; font-family:sans-serif; }
  canvas { background:#16213e; border:3px solid #0f3460; border-radius:8px; }
  #info { margin:10px; font-size:18px; }
  p { color:#9aa; font-size:14px; }
</style>
</head>
<body>
<div id="info">점수: <span id="score">0</span> · 최고: <span id="best">0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<p>방향키 / WASD로 이동 · 스페이스바로 시작/재시작 · 모바일은 화면 스와이프</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, S = cv.width / N;
let snake, dir, nextDir, food, score, best = 0, timer, running = false;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0};
  score = 0;
  placeFood();
  update();
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function start() {
  clearInterval(timer);
  reset();
  running = true;
  timer = setInterval(step, 110);
}
function step() {
  dir = nextDir;
  const h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)) return gameOver();
  snake.unshift(h);
  if (h.x===food.x && h.y===food.y) { score++; placeFood(); }
  else snake.pop();
  update();
}
function gameOver() {
  clearInterval(timer); running = false;
  best = Math.max(best, score);
  update();
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = '32px sans-serif'; ctx.fillText('게임 오버', 200, 190);
  ctx.font = '16px sans-serif'; ctx.fillText('스페이스바로 다시 시작', 200, 225);
}
function update() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#e94560';
  ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-2, 0, 7); ctx.fill();
  snake.forEach((s,i) => {
    ctx.fillStyle = i ? '#4ecca3' : '#7fffd4';
    ctx.fillRect(s.x*S+1, s.y*S+1, S-2, S-2);
  });
}
function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return; // 반대 방향 금지
  nextDir = {x, y};
}
const keys = {ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!running) start(); return; }
  const k = keys[e.key];
  if (k) { e.preventDefault(); turn(...k); }
});
let t0;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; if (!running) start(); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX-t0.clientX, dy = t.clientY-t0.clientY;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx),0) : turn(0,Math.sign(dy));
});

reset();
ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '20px sans-serif';
ctx.fillText('스페이스바를 눌러 시작', 200, 200);
</script>
</body>
</html>
