<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>스네이크 게임</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:none; background:#1a1a2e; color:#eee; font-family:sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:space-between;
         padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom)); }
  #info { font-size:clamp(16px,4.5vw,22px); }
  #wrap { position:relative; }
  canvas { display:block; background:#16213e; border:3px solid #0f3460; border-radius:10px; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(0,0,0,.6); border-radius:10px; text-align:center; gap:8px; }
  #overlay h2 { margin:0; font-size:32px; }
  #overlay.hidden { display:none; }
  #pad { display:grid; grid-template-columns:repeat(3, var(--b)); grid-template-rows:repeat(2, var(--b)); gap:8px; --b:clamp(56px,18vw,84px); }
  #pad button { border:0; border-radius:16px; background:#0f3460; color:#fff; font-size:28px; touch-action:manipulation; }
  #pad button:active { background:#4ecca3; }
  #up { grid-column:2; grid-row:1; }
  #left { grid-column:1; grid-row:2; }
  #down { grid-column:2; grid-row:2; }
  #right { grid-column:3; grid-row:2; }
</style>
</head>
<body>
<div id="info">점수: <span id="score">0</span> · 최고: <span id="best">0</span></div>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2 id="title">스네이크</h2>
    <div id="msg">화면을 탭해서 시작</div>
  </div>
</div>

<div id="pad">
  <button id="up" aria-label="위">▲</button>
  <button id="left" aria-label="왼쪽">◀</button>
  <button id="down" aria-label="아래">▼</button>
  <button id="right" aria-label="오른쪽">▶</button>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay');
const N = 20;
let S, snake, dir, nextDir, food, score = 0, best = 0, timer, running = false;
try { best = +localStorage.getItem('snakeBest') || 0; } catch(e) {}

// 화면 크기에 맞춰 정사각형 캔버스 크기 결정 (선명도를 위해 devicePixelRatio 반영)
function resize() {
  const availW = innerWidth - 30;
  const availH = innerHeight - 60 - Math.min(Math.max(innerWidth*0.18,56),84)*2 - 60;
  const size = Math.floor(Math.max(200, Math.min(availW, availH, 520)) / N) * N;
  const dpr = devicePixelRatio || 1;
  cv.style.width = cv.style.height = size + 'px';
  cv.width = cv.height = size * dpr;
  S = cv.width / N;
  if (snake) draw();
}
addEventListener('resize', resize);

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0};
  score = 0;
  placeFood();
  draw();
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function start() {
  clearInterval(timer);
  reset();
  running = true;
  overlay.classList.add('hidden');
  timer = setInterval(step, 120);
}
function step() {
  dir = nextDir;
  const h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)) return gameOver();
  snake.unshift(h);
  if (h.x===food.x && h.y===food.y) { score++; placeFood(); if (navigator.vibrate) navigator.vibrate(15); }
  else snake.pop();
  draw();
}
function gameOver() {
  clearInterval(timer); running = false;
  if (score > best) { best = score; try { localStorage.setItem('snakeBest', best); } catch(e) {} }
  if (navigator.vibrate) navigator.vibrate(120);
  document.getElementById('title').textContent = '게임 오버';
  document.getElementById('msg').textContent = '점수 ' + score + ' · 탭해서 다시 시작';
  draw();
  overlay.classList.remove('hidden');
}
function draw() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#e94560';
  ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-2, 0, 7); ctx.fill();
  snake.forEach((s,i) => {
    ctx.fillStyle = i ? '#4ecca3' : '#7fffd4';
    ctx.fillRect(s.x*S+1, s.y*S+1, S-2, S-2);
  });
}
function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return; // 반대 방향 금지
  nextDir = {x, y};
}

// 온스크린 방향 버튼 (pointerdown으로 지연 없이 반응)
const pad = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
for (const id in pad) {
  document.getElementById(id).addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!running) return;
    turn(...pad[id]);
  });
}

// 스와이프: 게임 영역 어디서든 가능
let t0 = null;
document.addEventListener('touchstart', e => { t0 = e.touches[0]; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX-t0.clientX, dy = t.clientY-t0.clientY;
  t0 = null;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 25) return;
  if (running) Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx),0) : turn(0,Math.sign(dy));
});

// 오버레이 탭 = 시작/재시작
overlay.addEventListener('click', start);

// 키보드(데스크톱)도 계속 지원
const keys = {ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!running) start(); return; }
  const k = keys[e.key];
  if (k) { e.preventDefault(); if (running) turn(...k); }
});

resize();
reset();
</script>
</body>
</html>
